<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abfahrten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a0b0d">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e1e4ea;--board:#0d0f12;--amber:#ffb400;--red:#e3000f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b0d;--card:#15181d;--ink:#f2f4f7;--mute:#98a2b3;--line:#262b33}}
:root[data-theme="dark"]{--bg:#0a0b0d;--card:#15181d;--ink:#f2f4f7;--mute:#98a2b3;--line:#262b33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:18px;margin:0}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.head{padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline}
.head b{font-size:17px}.head span{color:var(--mute);font-size:13px}
.board{background:var(--board);padding:6px 16px 10px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #23272e;color:var(--amber);font-variant-numeric:tabular-nums}
.row:last-child{border:0}
.ln{font-weight:700;font-size:20px;color:#fff;background:var(--red);border-radius:6px;text-align:center;padding:2px 0}
.ln.bus{background:#1d6fd8}
.to{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min{font-size:26px;font-weight:700;min-width:48px;text-align:right}
.min small{font-size:13px;font-weight:400;opacity:.7;margin-left:2px}
.empty{color:#98a2b3;padding:18px 0;text-align:center}
footer{color:var(--mute);font-size:12px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<main>
<header><h1>Meine Abfahrten</h1><span class="pill" id="mode">Live</span></header>
<div id="boards"></div>
<footer id="foot"></footer>
</main>
<script>
/* ===== Konfiguration =====
   demo:true  → simulierte Daten (hier im Chat nötig, da keine externen Abfragen möglich sind)
   demo:false → echte Abfrage der Wiener-Linien-Schnittstelle (in der Android-App) */
const CONFIG = {
  demo: false,
  proxyUrl: "", // nur nötig, falls der Browser die Direktabfrage blockiert
  baseUrl: "https://www.wienerlinien.at/ogd_realtime/monitor",
  refreshMs: 20000,
  boards: [
    { title: "Innstraße", sub: "Straßenbahn · stadteinwärts", type: "tram",
      stopIds: [316, 325] /* beide Richtungen; nach dem Test auf die richtige kürzen */,
      lines: ["2", "12"], towards: null,
      demo: [["2", "Stadteinwärts", 4], ["12", "Stadteinwärts", 7]] },
    { title: "Therese-Ammon-Park", sub: "Bus 11A · Richtung Vorgartenstraße", type: "bus",
      stopIds: [594, 621] /* beide Richtungen; nach dem Test auf die richtige kürzen */,
      lines: ["11A"], towards: /Vorgartenstr/i,
      demo: [["11A", "Vorgartenstraße", 3]] }
  ]
};

const state = CONFIG.boards.map(() => ({ deps: [], err: null }));
const $ = s => document.querySelector(s);

/* Echtabfrage: Schnittstelle liefert pro Abfahrt countdown (Minuten) – daraus Zielzeit */
async function fetchLive(b) {
  const q = b.stopIds.map(id => "stopId=" + id).join("&");
  const r = await fetch((CONFIG.proxyUrl || CONFIG.baseUrl) + "?" + q);
  const j = await r.json();
  if (j.message && j.message.messageCode !== 1) throw new Error(j.message.value);
  const now = Date.now(), out = [];
  for (const m of j.data.monitors || [])
    for (const l of m.lines || []) {
      if (!b.lines.includes(l.name)) continue;
      if (b.towards && !b.towards.test(l.towards)) continue;
      for (const d of l.departures.departure || [])
        out.push({ line: l.name, towards: (d.vehicle && d.vehicle.towards) || l.towards,
                   t: now + d.departureTime.countdown * 60000 });
    }
  return out.sort((a, c) => a.t - c.t).slice(0, 6);
}

/* Demo: laufende Abfahrten, die sich nach und nach erneuern */
function fetchDemo(b, prev) {
  const now = Date.now(), deps = prev.filter(d => d.t > now - 20000);
  for (const [line, towards, every] of b.demo) {
    const mine = deps.filter(d => d.line === line);
    let last = mine.length ? Math.max(...mine.map(d => d.t)) : now + (1 + Math.random() * every) * 60000;
    if (!mine.length) deps.push({ line, towards, t: last });
    while (deps.filter(d => d.line === line).length < 3) {
      last += (every + Math.floor(Math.random() * 3)) * 60000;
      deps.push({ line, towards, t: last });
    }
  }
  return deps.sort((a, c) => a.t - c.t).slice(0, 6);
}

async function refresh() {
  for (let i = 0; i < CONFIG.boards.length; i++) {
    try {
      state[i].deps = CONFIG.demo ? fetchDemo(CONFIG.boards[i], state[i].deps) : await fetchLive(CONFIG.boards[i]);
      state[i].err = null;
    } catch (e) { state[i].err = "Keine Verbindung (" + (e.message || e) + ")"; }
  }
  $("#foot").innerHTML = CONFIG.demo
    ? "Demodaten – simulierte Abfahrten.<br>Die echte Abfrage ist vorbereitet (demo: false)."
    : "Aktualisiert " + new Date().toLocaleTimeString("de-AT");
}

function render() {
  const now = Date.now();
  $("#boards").innerHTML = CONFIG.boards.map((b, i) => {
    const rows = state[i].deps.map(d => {
      const m = Math.max(0, Math.floor((d.t - now) / 60000));
      return `<div class="row"><div class="ln ${b.type === "bus" ? "bus" : ""}">${d.line}</div>
        <div class="to">${d.towards}</div><div class="min">${m}<small>min</small></div></div>`;
    }).join("");
    const body = state[i].err ? `<div class="empty">${state[i].err}</div>` : rows || `<div class="empty">Keine Abfahrten</div>`;
    return `<section class="card"><div class="head"><b>${b.title}</b><span>${b.sub}</span></div><div class="board">${body}</div></section>`;
  }).join("");
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
refresh().then(render);
setInterval(refresh, CONFIG.refreshMs);
setInterval(render, 1000);
</script>
</body>
</html>
